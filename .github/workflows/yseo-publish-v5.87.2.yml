name: Publish verified YSEO 5.87.2 corrective release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yseo-publish-v5.87.2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yseo-publish-v5.87.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout verified Git commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce gates, source identity and unchanged scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/44049123749" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/44049836301" --jq .conclusion)" = success
          grep -Eq '^ \* Version: 5\.87\.2$' yablonsky-seo.php
          grep -Fq "define( 'YSEO_VERSION', '5.87.2' );" yablonsky-seo.php
          grep -Fxq 'Stable tag: 5.87.2' readme.txt
          test "$(find . -path './.git' -prune -o -type f -name '*.php' ! -path './tests/*' -print | wc -l)" -eq 197
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find src -name '*.php' -type f -print0)
          php -l yablonsky-seo.php >/dev/null
          php -l uninstall.php >/dev/null
          echo 'Required validation gates, scope and PHP lint PASS'
      - name: Build installation ZIP from checked revision
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          mkdir -p "$stage/yablonsky-seo"
          cp LICENSE readme.txt yablonsky-seo.php uninstall.php "$stage/yablonsky-seo/"
          cp -a src assets data languages "$stage/yablonsky-seo/"
          (
            cd "$stage/yablonsky-seo"
            {
              echo '# YSEO v5.87.2 installation file checksums'
              echo '# Reference: YABLONSKY_PRODUCT_VERSIONING_CANON_v1.0.0_2026-09-21.md'
              find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's|  \./|  |'
            } > SHA256SUMS.txt
            tail -n +3 SHA256SUMS.txt | sha256sum -c --status
          )
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/yablonsky-seo-5.87.2.zip" yablonsky-seo)
          unzip -tq yablonsky-seo-5.87.2.zip >/dev/null
          test "$(stat -c %s yablonsky-seo-5.87.2.zip)" -lt 10000000
          sha256sum yablonsky-seo-5.87.2.zip
      - name: Publish and verify GitHub assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view v5.87.2 --repo "$GH_REPO" >/dev/null 2>&1; then
            cat > release-notes.txt <<'NOTES'
          # Yablonsky SEO 5.87.2

          Corrective WordPress.org pre-submission compatibility release: distinctive new Yablonsky SEO metadata keys, preserved historical data and functions, and safe migration from earlier plugin versions.

          ## Corrective changes
          - Remove four short-prefix YPS global constant declarations in the new plugin while retaining historical plugin detection.
          - New SEO post, term and user metadata writes use canonical `_yablseo_*` keys.
          - Preserve pre-5.87.2 `_yps_*` values in the database. Read-only fallback makes existing SEO settings available without a destructive bulk rewrite. Explicit field clears remain cleared.
          - Preserve old video sitemap discovery through both historic and canonical metadata keys; queries are fully prepared.
          - Preserve legacy options, sitemap state bridge, and cron cleanup with existing compatibility safeguards.

          ## Verified regression gates
          - WordPress PHP 8.3 + strict MySQL 8 upgrade from 5.86.6 to 5.87.2: 39 functional checks and 60 metadata compatibility assertions PASS.
          - PHP 7.4 source lint, safe activation/deactivation, WP_DEBUG and SQL regressions PASS.
          - Official WordPress Plugin Check: No errors found.
          - Targeted WPCS reviewer security/input/SQL/global-prefix rules: 0 errors / 0 warnings.
          - GitHub-managed, source-derived ZIP under 10 MB, with SHA256 manifest.

          Regression: https://github.com/yablonsky-io/yablonsky-seo/actions/runs/44049123749
          WPCS: https://github.com/yablonsky-io/yablonsky-seo/actions/runs/44049836301
          Change review: https://github.com/yablonsky-io/yablonsky-seo/pull/6

          WordPress.org reviewer approval is a separate external decision; this release does not claim prior acceptance.
          Versioning canon: YABLONSKY_PRODUCT_VERSIONING_CANON_v1.0.0_2026-09-21.md
          Product: https://yablonsky.io/seo/
          NOTES
            gh release create v5.87.2 yablonsky-seo-5.87.2.zip \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "Yablonsky SEO 5.87.2" --notes-file release-notes.txt --latest
            cp yablonsky-seo-5.87.2.zip yablonsky-seo.zip
            gh release upload v5.87.2 yablonsky-seo.zip --repo "$GH_REPO"
          fi
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = v5.87.2
          temp="$(mktemp -d)"
          gh release download v5.87.2 --repo "$GH_REPO" --dir "$temp" --pattern 'yablonsky-seo-5.87.2.zip'
          gh release download v5.87.2 --repo "$GH_REPO" --dir "$temp" --pattern 'yablonsky-seo.zip'
          cmp "$temp/yablonsky-seo-5.87.2.zip" "$temp/yablonsky-seo.zip"
          unzip -tq "$temp/yablonsky-seo-5.87.2.zip" >/dev/null
          test "$(unzip -p "$temp/yablonsky-seo-5.87.2.zip" yablonsky-seo/readme.txt | grep '^Stable tag:')" = 'Stable tag: 5.87.2'
          unzip -p "$temp/yablonsky-seo-5.87.2.zip" yablonsky-seo/yablonsky-seo.php | grep -Fq "define( 'YSEO_VERSION', '5.87.2' );"
          gh release view v5.87.2 --repo "$GH_REPO" --json url,tagName,assets --jq '{url:.url,tag:.tagName,assets:[.assets[].name]}'
