name: YSEO 5.87.0 candidate validation

on:
  push:
    branches: [develop/yseo-5.87.0]
    paths:
      - ".github/workflows/yseo-5.87.0-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wp
          MYSQL_PASSWORD: wordpress_ci_only
          MYSQL_ROOT_PASSWORD: wordpress_root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pwordpress_root_ci_only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout all source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PHP 7.4 syntax and executable behavior equivalence
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none
          coverage: none

      - name: Verify source scope, versions and PHP 7.4 syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Ec '^ \* Version: 5\.87\.0$' yablonsky-seo.php)" -eq 1
          test "$(grep -Ec '^Stable tag: 5\.87\.0$' readme.txt)" -eq 1
          grep -Fq "define( 'YSEO_VERSION', '5.87.0' );" yablonsky-seo.php
          git diff --name-only v5.86.9 HEAD -- '*.php' | grep -Ev '^(yablonsky-seo.php|src/SEO/InternalLinks/InternalLinkRepository.php|src/SEO/NotFound/NotFoundRepository.php)$' > unexpected_php.txt || :
          test ! -s unexpected_php.txt
          for file in src/SEO/InternalLinks/InternalLinkRepository.php src/SEO/NotFound/NotFoundRepository.php; do
            git show "v5.86.9:$file" > /tmp/yseo-original.php
            php -r '
              function executable_tokens($text) {
                $out = [];
                foreach (token_get_all($text) as $t) {
                  if (is_array($t)) {
                    if (in_array($t[0], [T_WHITESPACE, T_COMMENT, T_DOC_COMMENT], true)) continue;
                    $out[] = [$t[0], $t[1]];
                  } else { $out[] = $t; }
                }
                return $out;
              }
              if (executable_tokens(file_get_contents($argv[1])) !== executable_tokens(file_get_contents($argv[2]))) { exit(1); }
            ' /tmp/yseo-original.php "$file"
            echo "Executable token equivalence PASS: $file"
          done
          test "$(find . -path './.git' -prune -o -type f -name '*.php' -print | wc -l)" -eq 196
          while IFS= read -r -d '' file; do php -l "$file" > /dev/null; done < <(find . -path './.git' -prune -o -type f -name '*.php' -print0)
          echo "PHP 7.4 syntax PASS 196/196"
          python3 - <<'PY'
          import json, pathlib
          for f in pathlib.Path('data').glob('*.json'): json.loads(f.read_text())
          PY

      - name: Switch to PHP 8.3 for real WordPress installation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, xml, zip, curl
          coverage: none

      - name: Build installable ZIP from this candidate
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          mkdir -p "$stage/yablonsky-seo"
          cp LICENSE readme.txt yablonsky-seo.php uninstall.php "$stage/yablonsky-seo/"
          cp -a src assets data languages "$stage/yablonsky-seo/"
          (
            cd "$stage/yablonsky-seo"
            {
              echo "# Yablonsky SEO 5.87.0 source manifest"
              echo "# Canon: YABLONSKY_PRODUCT_VERSIONING_CANON_v1.0.0_2026-09-21.md"
              find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's|  \./|  |'
            } > SHA256SUMS.txt
            tail -n +3 SHA256SUMS.txt | sha256sum -c --status
          )
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/yablonsky-seo-5.87.0.zip" yablonsky-seo)
          unzip -tq yablonsky-seo-5.87.0.zip > /dev/null
          test "$(unzip -Z1 yablonsky-seo-5.87.0.zip | grep -c '^yablonsky-seo/')" -gt 281
          test "$(stat -c %s yablonsky-seo-5.87.0.zip)" -lt 10000000
          echo "Candidate ZIP PASS under 10 MB"
          sha256sum yablonsky-seo-5.87.0.zip

      - name: Set up WordPress with WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$RUNNER_TEMP/wp-cli.phar"
          wp() { php "$RUNNER_TEMP/wp-cli.phar" "$@"; }
          mkdir -p "$RUNNER_TEMP/wordpress"
          wp core download --path="$RUNNER_TEMP/wordpress"
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=wordpress --dbuser=wp --dbpass=wordpress_ci_only --dbhost=127.0.0.1 --skip-check
          wp core install --path="$RUNNER_TEMP/wordpress" --url="http://localhost:8080" --title="YSEO Check" --admin_user=admin --admin_password=temporary-ci-only-password --admin_email=ci@example.invalid --skip-email
          wp plugin install "$GITHUB_WORKSPACE/yablonsky-seo-5.87.0.zip" --activate --path="$RUNNER_TEMP/wordpress"
          wp plugin is-active yablonsky-seo --path="$RUNNER_TEMP/wordpress"
          wp plugin get yablonsky-seo --field=version --path="$RUNNER_TEMP/wordpress" | grep -Fx '5.87.0'
          wp plugin install plugin-check --activate --path="$RUNNER_TEMP/wordpress"
          wp eval ' $p=wp_insert_post(array("post_title"=>"YSEO Smoke","post_status"=>"publish","post_content"=>"Search metadata smoke test","post_type"=>"post")); if (is_wp_error($p)||!$p) exit(12); update_post_meta($p,"_yps_seo_title","YSEO test title"); if (get_post_meta($p,"_yps_seo_title",true)!=="YSEO test title") exit(13); echo "WordPress post/meta smoke PASS\\n"; ' --path="$RUNNER_TEMP/wordpress"
          echo "Runtime activation and metadata smoke PASS"

      - name: Run official WordPress Plugin Check
        shell: bash
        run: |
          set -euo pipefail
          wp() { php "$RUNNER_TEMP/wp-cli.phar" "$@"; }
          wp plugin check yablonsky-seo --path="$RUNNER_TEMP/wordpress" --require="$RUNNER_TEMP/wordpress/wp-content/plugins/plugin-check/cli.php" 2>&1 | tee "$RUNNER_TEMP/plugin-check-result.txt"
          echo "Plugin Check PASS"

      - name: Test clean deactivation and reactivation
        shell: bash
        run: |
          set -euo pipefail
          wp() { php "$RUNNER_TEMP/wp-cli.phar" "$@"; }
          wp plugin deactivate yablonsky-seo --path="$RUNNER_TEMP/wordpress"
          wp plugin activate yablonsky-seo --path="$RUNNER_TEMP/wordpress"
          wp plugin is-active yablonsky-seo --path="$RUNNER_TEMP/wordpress"
          echo "Activation cycle PASS"
